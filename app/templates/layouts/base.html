<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistem Diagnosis Dinamo Industri{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Chakra Petch"', 'sans-serif'],
                        body: ['"Sora"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        industrial: {
                            900: '#0B0C10',
                            800: '#1F2833',
                            100: '#C5C6C7',
                        },
                        neon: {
                            cyan: '#66FCF1',
                            teal: '#45A29E'
                        }
                    },
                    backgroundImage: {
                        'grid-pattern': "linear-gradient(to right, #1F2833 1px, transparent 1px), linear-gradient(to bottom, #1F2833 1px, transparent 1px)",
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Sora:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0B0C10;
            color: #C5C6C7;
        }
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(31, 40, 51, 0.5) 1px, transparent 1px), linear-gradient(to bottom, rgba(31, 40, 51, 0.5) 1px, transparent 1px);
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0C10; 
        }
        ::-webkit-scrollbar-thumb {
            background: #1F2833; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #45A29E; 
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col antialiased font-body bg-grid relative selection:bg-neon-cyan selection:text-industrial-900">
    <!-- Ambient glow effect -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-[-1]">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-neon-teal/10 blur-[120px] rounded-full mix-blend-screen"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-neon-cyan/5 blur-[120px] rounded-full mix-blend-screen"></div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="fixed top-6 right-6 z-50 flex flex-col gap-3 font-mono text-sm">
            {% for category, message in messages %}
                <div class="px-5 py-4 border-l-4 shadow-2xl backdrop-blur-md bg-industrial-800/90 
                    {% if category == 'error' %}border-red-500 text-red-100{% else %}border-neon-cyan text-neon-cyan{% endif %}
                    animate-[slideIn_0.3s_ease-out_forwards]">
                    <div class="flex items-center gap-3">
                        <span class="opacity-70 text-xs">[{{ category|upper }}]</span>
                        {{ message }}
                    </div>
                </div>
            {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <main class="relative z-10 flex-grow flex flex-col">
        {% block content %}{% endblock %}
    </main>

    <style>
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</body>
</html>
