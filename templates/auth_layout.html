{% extends 'base.html' %}
{% import 'components.html' as components %}

{% block content %}
<div class="flex min-h-screen w-full flex-col lg:flex-row">
    <!-- Left Side: Brand / Visual -->
    <div class="lg:w-1/2 p-8 lg:p-16 flex flex-col justify-between border-b lg:border-b-0 lg:border-r border-industrial-800 bg-industrial-900/50 backdrop-blur-sm relative overflow-hidden">
        <div class="absolute -left-32 -bottom-32 w-96 h-96 border border-industrial-800 rounded-full opacity-50"></div>
        <div class="absolute -left-16 -bottom-16 w-96 h-96 border border-industrial-800 rounded-full opacity-50"></div>
        
        <div class="relative z-10 flex items-center gap-4">
            <div class="w-12 h-12 bg-neon-cyan text-industrial-900 flex items-center justify-center font-display font-bold text-2xl rotate-45">
                <span class="-rotate-45">D</span>
            </div>
            <span class="font-display font-bold text-xl tracking-widest text-industrial-100 uppercase">DIAG-D System</span>
        </div>

        <div class="relative z-10 mt-20 lg:mt-0">
            <h1 class="text-5xl lg:text-7xl font-display font-bold text-transparent bg-clip-text bg-gradient-to-br from-white to-industrial-100/50 leading-tight mb-6">
                {% block auth_title %}{% endblock %}
            </h1>
            <p class="font-mono text-sm text-industrial-100/60 max-w-md border-l-2 border-neon-cyan/50 pl-4">
                {% block auth_description %}{% endblock %}
            </p>
        </div>
        
        <div class="relative z-10 mt-12 font-mono text-xs text-industrial-100/40 flex items-center gap-4">
            {% block auth_status %}{% endblock %}
        </div>
    </div>

    <!-- Right Side: Form -->
    <div class="lg:w-1/2 flex items-center justify-center p-8 lg:p-16 relative">
        <div class="w-full max-w-md relative z-10">
            {% block auth_form %}{% endblock %}
        </div>
        
        <!-- Corner accents for the form container -->
        <div class="absolute top-8 right-8 w-4 h-4 border-t-2 border-r-2 border-industrial-800"></div>
        <div class="absolute bottom-8 right-8 w-4 h-4 border-b-2 border-r-2 border-industrial-800"></div>
        <div class="absolute bottom-8 left-8 w-4 h-4 border-b-2 border-l-2 border-industrial-800 hidden lg:block"></div>
    </div>
</div>
{% endblock %}
